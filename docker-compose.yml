services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-describeia}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-describeia}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-describeia}
      UPLOADS_DIR: /data/uploads
      # LLM_FAKE=1 docker compose up: no model, no key (also what the end-to-end test uses)
      LLM_FAKE: ${LLM_FAKE:-}
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/migrations:/repo/apps/api/migrations
      - ./apps/api/prompts:/repo/apps/api/prompts
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${PORT:-4000}/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:${PORT:-4000}
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine "localhost" is tried as ::1 first and Next.js listens on IPv4 only.
      # The first request makes Next.js compile the page: give it time.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/']
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s

volumes:
  postgres_data:
  uploads:
